<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notas</title>
    <script defer type="module" src="./src/crudLogic.js"></script>
    <script defer type="module" src="./src/authLogic.js"></script>
    <link rel="stylesheet" href="./style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Josefin+Sans:ital,wght@0,100..700;1,100..700&family=Pixelify+Sans:wght@400..700&family=Roboto:ital,wght@0,100..900;1,100..900&family=Source+Code+Pro:ital,wght@0,200..900;1,200..900&family=Tiny5&display=swap"
        rel="stylesheet">
</head>

<body>
    <h1>tu pizarra</h1>

    <div class="authDiv" id="authDivLogin">
        <h2>Login</h2>
        <label for="username">Mail</label>
        <input type="text" id="username" placeholder="hola@mail.com">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Hola*_123">
        <p id="notRegistered">No tienes cuenta? Registrate</p>
        <p class="errors" id="loginErrors"></p>
        <input type="button" id="signInGoogle" value="Sign In With Google">


        <input type="submit" id="submitLogin" value="Submit">
    </div>

    <div class="authDiv" id="authDivRegister">
        <h2>Register</h2>
        <label for="usernameRegister">Mail</label>
        <input type="text" id="usernameRegister">
        <label for="passwordRegister">Password</label>
        <input type="password" id="passwordRegister">
        <label for="passwordRegister2">Repeat password</label>
        <input type="password" id="passwordRegister2">
        <p id="notLogged">Ya tienes cuenta? Logeate</p>
        <p  class="errors"  id="registerErrors"></p>
        <input type="button" id="registerGoogle" value="Register With Google">

        
        <input type="submit" id="submitRegister" value="Submit">
    </div>

    <div id="pizarra">
        <div>
            <p id="helloWorld"></p>
            <img  id="profilePic" src="" alt="">
        </div>
        <div id="infoInicial">
            <h2>Bienvenido a la tu pizarra</h2>
            <div>
                <p>Puedes arrastrar las notas manteniendo pulsado sobre el título</p>
                <p>Crea notas con el icono +</p>
                <p>Los cambios se actualizan en la nube</p>
            </div>
            <button id="okButton">Ok</button>
            <button id="notShowAgainButton">No mostrar Otra vez</button>


        </div>
        
    </div>
    <div id="confirmDelete">
            <p>Do you want to delete?</p>
            <button id="confirmDeleteYes">Yes</button>
            <button id="confirmDeleteNo">No</button>
        </div>
    <div id="addNotaButton" style="left: 5vw; top: 85vh;">+</div>

</body>

</html>
